name: Clean USB host volume resync release assets

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  clean-release-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Remove redundant checksum assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.1.6-beta1-usb-safe-20db
        shell: bash
        run: |
          set -euo pipefail
          gh release delete-asset "$TAG" DSPi-Pico-RP2040-USB-host-volume-resync.uf2.sha256 --repo CrawlingKingSn8ke/DSPi --yes
          gh release delete-asset "$TAG" DSPi-Pico2-RP2350-USB-host-volume-resync.uf2.sha256 --repo CrawlingKingSn8ke/DSPi --yes
          gh release view "$TAG" --repo CrawlingKingSn8ke/DSPi --json url,assets
