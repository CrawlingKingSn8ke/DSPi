name: Update USB host volume resync release notes

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  update-release-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Update release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.1.6-beta1-usb-safe-20db
        shell: bash
        run: |
          set -euo pipefail
          NOTES=$(cat <<'EOF'
          Event-driven UAC1 host volume resynchronization.

          Supported firmware targets:
          - Raspberry Pi Pico 2 — RP2350
          - Raspberry Pi Pico — RP2040

          USB entry forces User Volume to -20 dB, reports the device-side change through the AudioControl status endpoint, and resumes normal host volume control after readback. The previous timed startup guard has been removed.

          Release asset note:
          - DSPi-Pico2-USB-host-volume-resync.uf2 is the RP2350 / Raspberry Pi Pico 2 test build.
          - RP2040 / Raspberry Pi Pico was also compile- and RAM-placement regression-tested successfully, but an RP2040 UF2 is not attached to this test release.
          EOF
          )
          gh release edit "$TAG" \
            --repo CrawlingKingSn8ke/DSPi \
            --title "DSPi v1.1.6 beta1 USB safe -20 dB" \
            --notes "$NOTES"
          gh release view "$TAG" --repo CrawlingKingSn8ke/DSPi --json url,tagName,targetCommitish,name,body,assets
